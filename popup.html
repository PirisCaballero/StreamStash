<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --ink: #1d2433; --muted: #5f6b80; --line: #d9dee8;
      --paper: #ffffff; --accent: #1f6feb; --stream: #8a5a00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 380px; max-height: 560px;
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink); background: var(--paper);
    }
    header { padding: 12px 14px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 6px; }
    #count { color: var(--muted); font-size: 12px; }
    ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; max-height: 480px; }
    li { padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .name { font-weight: 600; word-break: break-all; }
    .meta { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
    .meta.stream { color: var(--stream); }
    .actions { display: flex; gap: 6px; }
    button {
      font: inherit; padding: 5px 10px; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .empty { padding: 20px 14px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1><img src="icons/icon-32.png" alt="" width="18" height="18"> StreamStash</h1>
    <div id="count"></div>
  </header>
  <ul id="list"></ul>
  <script src="popup.js"></script>
</body>
</html>
