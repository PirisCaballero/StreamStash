<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>StreamStash</title>
  <link rel="icon" href="icons/icon-32.png">
  <style>
    :root { --ink:#1d2433; --muted:#5f6b80; --line:#d9dee8; --accent:#1f6feb; --ok:#1a7f37; --err:#b42318; }
    body { margin:0; font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); }
    main { max-width:560px; margin:64px auto; padding:0 20px; }
    h1 { font-size:20px; font-weight:650; margin:0 0 4px; word-break:break-word; }
    #quality { color:var(--muted); margin:0 0 24px; }
    #status { font-weight:600; margin:0 0 8px; }
    progress { width:100%; height:10px; appearance:none; border:none; border-radius:5px; overflow:hidden; background:var(--line); }
    progress::-webkit-progress-bar { background:var(--line); }
    progress::-webkit-progress-value { background:var(--accent); }
    progress::-moz-progress-bar { background:var(--accent); }
    #detail { color:var(--muted); margin:8px 0 0; font-variant-numeric:tabular-nums; }
    #notes p { margin:16px 0 0; padding:10px 12px; border-left:3px solid var(--line); color:var(--muted); }
    details { margin-top:24px; }
    summary { cursor:pointer; color:var(--muted); }
    pre { background:#f4f6fa; border:1px solid var(--line); border-radius:6px; padding:10px; font-size:12px; overflow:auto; max-height:320px; }
    button { font:inherit; padding:5px 10px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; }
    details { margin-top:24px; color:var(--muted); }
    summary { cursor:pointer; }
    pre { white-space:pre-wrap; font-size:12px; background:#f4f6f9; padding:10px 12px; border-radius:6px; user-select:all; }
    .ok #status { color:var(--ok); }
    .error #status { color:var(--err); }
  </style>
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <p id="quality"></p>
    <p id="status">Preparando…</p>
    <progress id="bar" max="1" value="0"></progress>
    <p id="detail"></p>
    <div id="notes"></div>
    <details id="diag" hidden>
      <summary>Detalles técnicos</summary>
      <pre id="diagText"></pre>
    </details>
    <details id="diagBox" hidden>
      <summary>Detalles técnicos</summary>
      <pre id="diag"></pre>
      <button id="copyDiag">Copiar detalles</button>
    </details>
  </main>
  <script src="download.js"></script>
</body>
</html>
